        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/expenditure/{user_id}/ons":
    get:
      summary: Returns monthly ONS V3.0 affordability estimates for a user
      description: |
        Estimates cost of living and housing from the user's payroll periods,
        date of birth, and postcode using the Teal V3.0 ONS Family Spending
        model (table A6).

        Net pay is split across calendar months by overlapping days. Age is
        taken as of the last day of each month from that period's date of
        birth (else the user's) and adjusts cost of living only.
        Region (from each period's postcode prefix, else the user's first
        postcode that has an ONS region) adjusts housing only.

        Months are skipped, not returned, when their net pay is zero or
        negative (refunds, reversals) or when no postcode for the month has
        an ONS region (for example GY, JE, IM or an unknown postcode).

        `404` lists each missing or invalid input as its own string in
        `errors`:
        - `User [<user_id>] not found`
        - `[date_of_birth] param is missing on the user and its payslips`
        - `[post_codes] param is missing on the user and its payslips`
        - `[date_of_birth] param <date> is after the payslip month`
        - `[date_of_birth] param <date> gives an age over 150, the ONS model limit`
        - `Postcode <postcode> has no ONS region; supported: England, Wales, Scotland, Northern Ireland`
          (only when no month has a postcode with a region)
        - `payroll periods are missing`
        - `payroll periods have no positive net pay`
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the user to estimate expenditure for
      responses:
        "200":
          description: Monthly expenditure estimates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OnsExpenditureResponse"
              example:
                expenditures:
                  - date: "2026-01-01T12:00Z"
                    cost_of_living: "333.21"
                    housing: "372.96"
                    total: "706.17"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          description: User not found, or required inputs are missing or invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                errors:
                  - "[date_of_birth] param is missing on the user and its payslips"
                  - "[post_codes] param is missing on the user and its payslips"
                  - payroll periods are missing
