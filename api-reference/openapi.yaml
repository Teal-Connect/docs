---
openapi: 3.0.1
info:
  title: Payroll API
  description: A full flagged payroll api provided by Teal
  version: 1.0.0
servers:
  - url: https://api.sandbox.goteal.co
    description: Sandbox server for experiments
  - url: https://api.goteal.co
    description: Production server
security:
  - ApiKeyAuth: []
  - MemberBearerAuth: []
paths:
  "/users":
    description: A User represents the borrowers and end-users that
      give authorised access and/or upload their payslips to our API.
    post:
      summary: Creates a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/User"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedUser"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "409":
          "$ref": "#/components/responses/ConflictedResource"

    get:
      summary: List all users.
      parameters:
        - name: offset
          in: query
          description: The offset to start at
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  users:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CreatedUser"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/users/{user_id}":
    description: A User represents the borrowers and end-users that give
      authorised access and/or upload their payslips to our API.
    get:
      summary: Returns a user.
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
          required: true
          description: ID of the user to retrieve.
      responses:
        "200":
          description: Returns the user details
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedUser"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
    patch:
      description: Update a user and its config. If a field is sent as null then it is considered an unset or removal.
      summary: Updates a user.
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
          required: true
          description: ID of the user to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/User"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedUser"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          "$ref": "#/components/responses/ResourceNotFound"
    delete:
      summary: Deletes a user along with all the files, accounts, entries and payroll submission associated with it.
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
          required: true
          description: ID of the user to delete.
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully.
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          "$ref": "#/components/responses/ResourceNotFound"
  "/users/recurring":
    description: List users that are either eligible or ineliegible for recurring paroll checks
    get:
      parameters:
        - name: recurring_enabled
          in: query
          description: Filter on users that are eligible for recurring checks, and those that are not
          required: false
          schema:
            type: boolean
            default: true
        - name: offset
          in: query
          description: The offset to start at
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 500
        - name: type
          in: query
          description: Filter by document type
          required: false
          schema:
            type: string
            enum:
              - Payslip
              - Bank Statement
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    "$ref": "#/components/schemas/PaginationWithOrderedBy"
                  users:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CreatedUser"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/users/{user_id}/email":
    post:
      summary: Sends a user an email containing their Teal link.
      description: |
        Emails the user a link to Teal's hosted flow, using the address stored
        on the user. A new link is generated for every send, so you do not need
        to call `POST /user-tokens` first.

        `link_type` selects the link:
          - `connection` — the user connects their payroll or HR account.
          - `upload` — the user uploads documents. Requires
            `payslip_upload_enabled` for the user.

        The email is rendered from the template given in `template_id`, or
        from your default template when it is omitted (see
        `GET /email-templates`). It is sent by Teal unless you have configured
        your own SMTP server with `POST /configuration/email-smtp`.

        A `200` means the message was accepted for delivery, not that it
        reached the inbox. Use `GET /email-send-log` to follow up on bounces
        and complaints.

        **Rate limits.** By default you can send 100 emails every 10 minutes,
        and the same link type to the same address once every 60 seconds. A
        request over either limit returns `429` with a `Retry-After` header.

        **Error codes** returned in `errors`:

        | Status | Code | Meaning |
        | --- | --- | --- |
        | 400 | `user_has_no_email` | The user has no email address. |
        | 400 | `upload_not_enabled` | `link_type` is `upload` but `payslip_upload_enabled` is off for the user. |
        | 400 | `smtp_not_configured` | Your delivery mode is `CLIENT_SMTP` but the SMTP settings are missing or incomplete. |
        | 400 | `unsupported_delivery_mode` | Your email delivery mode is not supported. |
        | 429 | `rate_limited` | A rate limit was reached. |
        | 502 | `ses_failure` | Teal's email provider rejected the message. |
        | 502 | `smtp_failure` | Your SMTP server rejected the message. |
      parameters:
        - in: path
          name: user_id
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the user to email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SendEmailRequest"
      responses:
        "200":
          description: OK — the email was accepted for delivery
          content:
            application/json:
              schema:
                type: object
                required: [message_id]
                properties:
                  message_id:
                    type: string
                    description: Identifier of the sent message, assigned by the email provider.
                    example: 0102018f3c5e7a2b-6f1d2c3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f-000000
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          description: The user or the template does not exist
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          "$ref": "#/components/responses/EmailRateLimited"
        "502":
          "$ref": "#/components/responses/EmailDeliveryFailed"
  "/users/email/bulk":
    post:
      summary: Sends several users an email containing their Teal link.
      description: |
        Sends the same email as `POST /users/{user_id}/email` to up to 1000
        users in one request. Each user gets their own link.

        The request succeeds as a whole even when some users cannot be
        emailed: the response has one entry per user in `results`, in the
        order the IDs were submitted, plus a `summary` of the counts. Repeated
        IDs are sent once and reported in `warnings`.

        Each result has a `status`, and a `reason` when it is not `sent`:

        | Status | Reason | Meaning |
        | --- | --- | --- |
        | `sent` | — | The email was accepted for delivery. |
        | `skipped` | `no_email` | The user has no email address. |
        | `failed` | `not_found` | The user does not exist. |
        | `failed` | `upload_not_enabled` | `link_type` is `upload` but `payslip_upload_enabled` is off for the user. |
        | `failed` | `rate_limited` | The same link type was sent to this address in the last 60 seconds. |
        | `failed` | `ses_failure` | Teal's email provider rejected the message. |
        | `failed` | `smtp_failure` | Your SMTP server rejected the message. |
        | `failed` | `send_aborted` | The send was interrupted by an unexpected error. The email may or may not have gone out; check `GET /email-send-log` before retrying. |

        A `400` is returned, and nothing is sent, when the request itself is
        invalid. The `errors` array then holds a validation message or one of
        the codes `template_not_found`, `smtp_not_configured` or
        `unsupported_delivery_mode`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SendEmailBulkRequest"
      responses:
        "200":
          description: OK — the request was processed; check `results` for the outcome per user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SendEmailBulkResponse"
              example:
                results:
                  - user_id: 95a0e70b-fe02-4f47-aef9-2efff279df71
                    status: sent
                  - user_id: 1b7c1a52-6c0d-4b4e-9d0a-0a4f6f0d2c11
                    status: skipped
                    reason: no_email
                summary:
                  sent: 1
                  skipped: 1
                  failed: 0
                warnings: []
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "500":
          description: The send was interrupted by an unexpected error. The body has the same shape as a `200`; users not confirmed as sent are `failed` with `send_aborted`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SendEmailBulkResponse"
  "/email-send-log":
    get:
      summary: Lists the emails sent to your users.
      description: |
        Returns one entry per email Teal attempted to send for you, newest
        first, including template test sends from the Console. Use it to
        check whether an email was delivered, bounced or marked as spam.

        Delivery, bounce and complaint updates are only recorded for emails
        sent by Teal. Emails sent through your own SMTP server stay `sent`
        once your server accepts them.
      parameters:
        - name: offset
          in: query
          description: The offset to start at
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 1000
            default: 20
        - name: status
          in: query
          description: Only return emails with this status
          required: false
          schema:
            "$ref": "#/components/schemas/EmailSendStatus"
        - name: user_id
          in: query
          description: Only return emails sent to this user
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Only return emails created at or after this time
          required: false
          schema:
            type: string
            format: date-time
            example: 2026-01-01T00:00:00.000Z
        - name: to
          in: query
          description: Only return emails created at or before this time. Defaults to now.
          required: false
          schema:
            type: string
            format: date-time
            example: 2026-12-31T23:59:59.000Z
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/EmailSendLogEntry"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/email-templates":
    description: Email templates define the subject and body of the emails sent to your users.
    post:
      summary: Creates an email template.
      description: |
        Templates are plain text. Teal also sends an HTML version, generated
        from the same body with line breaks preserved.

        Insert a variable as `{{name}}`. A body that uses any other variable
        is rejected. The available variables are:

        | Variable | Value |
        | --- | --- |
        | `{{user.forename}}` | The user's forename |
        | `{{user.surname}}` | The user's surname |
        | `{{user.full_name}}` | Forename and surname |
        | `{{user.email}}` | The user's email address |
        | `{{client.name}}` | Your display name |
        | `{{links.connection}}` | The link generated for this email |
        | `{{links.upload}}` | The link generated for this email |

        Both link variables resolve to the one link generated for the send,
        which is of the `link_type` requested, so a template works for either
        link type whichever variable it uses.

        Template names must be unique. A name already in use returns `400`
        with the code `template_name_taken`.

        When authenticating with a member token, creating, changing, deleting
        and previewing templates requires the Admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmailTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmailTemplate"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
    get:
      summary: Lists your email templates.
      description: |
        Always includes a default template: one named `Default` is created
        for you the first time templates are listed or an email is sent.
      parameters:
        - name: offset
          in: query
          description: The offset to start at
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  templates:
                    type: array
                    items:
                      "$ref": "#/components/schemas/EmailTemplate"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/email-templates/{id}":
    get:
      summary: Returns an email template by id.
      parameters:
        - "$ref": "#/components/parameters/EmailTemplateId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmailTemplate"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          "$ref": "#/components/responses/ResourceNotFound"
    put:
      summary: Replaces an email template.
      description: |
        Replaces every field of the template, with the same rules as
        `POST /email-templates`. `is_default` is `false` when omitted, so send
        `is_default: true` when updating your default template to keep it as
        the default.
      parameters:
        - "$ref": "#/components/parameters/EmailTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmailTemplateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmailTemplate"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          "$ref": "#/components/responses/ResourceNotFound"
    delete:
      summary: Deletes an email template.
      description: |
        The default template cannot be deleted: the request returns `400`
        with the code `cannot_delete_default_template`. Make another template
        the default first. Emails already sent with the template stay in the
        send log.
      parameters:
        - "$ref": "#/components/parameters/EmailTemplateId"
      responses:
        "204":
          description: No Content
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          "$ref": "#/components/responses/ResourceNotFound"
  "/email-templates/{id}/preview":
    post:
      summary: Renders an email template without sending it.
      description: |
        Returns the subject and body as a recipient would see them. Variables
        are filled with sample values unless you supply your own in
        `variables`. Send an empty object, `{}`, to use the sample values.
      parameters:
        - "$ref": "#/components/parameters/EmailTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  description: Values to render the template with, keyed by variable name. Replaces the sample values entirely; a variable you leave out is shown unrendered.
                  additionalProperties:
                    type: string
                  example:
                    user.forename: Jane
                    client.name: Acme Lending
                    links.connection: https://connect.goteal.io/example-token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [subject, body_plaintext, body_html]
                properties:
                  subject:
                    type: string
                    example: "Action Required: Verify Your Payroll"
                  body_plaintext:
                    type: string
                    example: "Hi Jane,\n\nPlease follow this link to verify your payroll: https://connect.goteal.io/example-token\n\nThanks,\nAcme Lending"
                  body_html:
                    type: string
                    example: "Hi Jane,<br><br>Please follow this link to verify your payroll: https://connect.goteal.io/example-token<br><br>Thanks,<br>Acme Lending"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          "$ref": "#/components/responses/ResourceNotFound"
  "/configuration/email-smtp":
    description: Send user emails through your own SMTP server instead of Teal's email provider.
    post:
      summary: Sets your SMTP server for user emails.
      description: |
        Stores your SMTP settings and switches email delivery to your server
        (`email_delivery_mode` becomes `CLIENT_SMTP`). Every field must be
        sent each time, including the password.

        Teal connects to the server with the supplied credentials before
        saving. If that fails, nothing is saved and the request returns `400`
        with the reason. The password is stored encrypted and is never
        returned.

        When authenticating with a member token, the SMTP endpoints require
        the Admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmailSmtpConfigRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmailSmtpConfig"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
    get:
      summary: Returns your SMTP settings.
      description: The password is never returned; `password_set` tells you whether one is stored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmailSmtpConfig"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
        "404":
          description: No SMTP server is configured. `errors` contains `smtp_not_configured`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: Removes your SMTP settings.
      description: Deletes the stored SMTP settings and switches email delivery back to Teal (`email_delivery_mode` becomes `TEAL`).
      responses:
        "204":
          description: No Content
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/user-tokens":
    post:
      summary: Generate a link token for authentication in subsequent steps to a unique user ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  description: The id of the user
                  example: 95a0e70b-fe02-4f47-aef9-2efff279df71
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserToken"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/accounts":
    description:
      Account are the payroll and HR platform accesses that users link to Teal,
      providing a stream of income and employment data
    post:
      summary: Creates an account for the user e.g. a Xero account
      parameters:
        - "$ref": "#/components/parameters/XAuthorisationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: ["user_id"]
                  properties:
                    user_id:
                      type: string
                      description: The id of the user
                      example: 95a0e70b-fe02-4f47-aef9-2efff279df71
                    from:
                      type: string
                      format: date-time
                      description: Optional start date filter for payroll data retrieval
                      example: 2019-05-17T00:00:00.000Z
                    to:
                      type: string
                      format: date-time
                      description: Optional end date filter for payroll data retrieval
                      example: 2019-05-17T00:00:00.000Z
                - "$ref": "#/components/schemas/Accounts"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/AccountsResult"
                  - type: object
                    properties:
                      authorization_url:
                        type: string
                        description: Authrorization url for provider using OAUTH2
                        example: https://provider/authenticate?redirect_url=https://api.teal.com/auth&state=state&scope=read
                  - type: object
                    properties:
                      mfa_method:
                         "$ref": "#/components/schemas/MfaMethod"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
    get:
      summary: Returns all accounts for the user (e.g. Xero accounts)
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          required: true
          description: ID of the user to get accounts for
        - name: offset
          in: query
          description: The offset to start at
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Successfully retrieved accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  accounts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AccountsResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/UnauthorizedApiKey"
  "/accounts/recurring":
    description:
      Return accounts that are applicable for recurring checks for a given user
    get:
      summary: Returns all recurring accounts for the user
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          required: true
          description: ID of the user to get accounts for
        - name: offset
          in: query
          description: The offset to start at
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
